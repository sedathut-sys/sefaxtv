<!doctype html><html><head><meta charset="utf-8"><title>Own local JSChannel fixture</title></head><body><script type="module">
import {build} from './vendor/channel.mjs';
const channel=build({window:parent,origin:'http://127.0.0.1:18761',scope:'peertube'});
channel.bind('isReady',()=>true);
let position=0;
setInterval(()=>{position+=.5;channel.notify({method:'playbackStatusUpdate',params:{position,playbackState:'playing'}});},500);
</script></body></html>
