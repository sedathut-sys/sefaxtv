name: SefaXTV 0.18 Browser comparison
on:
  push:
    branches: ['lab/sefaxtv-pilot-v018']
    paths: ['pilot018/**', '.github/workflows/pilot-018.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, chrome-headed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pilot017/test-progress.mjs
      - run: |
          npm install --no-save --ignore-scripts --package-lock=false @peertube/embed-api@0.2.0
          mkdir -p pilot017/vendor
          cp node_modules/@peertube/embed-api/build/player.min.js pilot017/vendor/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile pilot018/test_browser_matrix.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - if: matrix.browser != 'chromium'
        run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chrome; fi
          google-chrome --version
      - run: |
          if [ "${{ matrix.browser }}" = chrome-headed ]; then
            xvfb-run -a python pilot018/test_browser_matrix.py --browser chrome-headed
          else
            python pilot018/test_browser_matrix.py --browser "${{ matrix.browser }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot018-${{ matrix.browser }}-screenshots
          path: pilot018-results/
          if-no-files-found: ignore
          retention-days: 7
