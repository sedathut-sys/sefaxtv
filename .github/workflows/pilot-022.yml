name: SefaXTV 0.22 single external bridge probe
on:
  push:
    branches: ['lab/sefaxtv-pilot-v022']
    paths: ['pilot022/**', '.github/workflows/pilot-022.yml']
permissions:
  contents: read
concurrency:
  group: sefaxtv-external-single-probe
  cancel-in-progress: false
jobs:
  single:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pilot021/test-bridge.mjs
      - run: node --check pilot022/diagnostic.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pilot019/test_continuity.py
      - run: python -m py_compile pilot022/test_external_once.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chrome; fi
      - run: python pilot022/test_external_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot022-single-evidence
          path: pilot022-results/
          if-no-files-found: ignore
          retention-days: 7
