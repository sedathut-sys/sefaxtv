name: SefaXTV 0.20 Narrow origin-bound bridge LAB
on:
  push:
    branches: ['lab/sefaxtv-pilot-v020']
    paths: ['pilot020/**', '.github/workflows/pilot-020.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, chrome-headed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pilot020/test-bridge.mjs
      - run: node --check pilot020/diagnostic.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pilot019/test_continuity.py
      - run: python -m py_compile pilot020/test_browser_continuity.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chrome; fi
      - run: |
          if [ "${{ matrix.browser }}" = chrome-headed ]; then
            xvfb-run -a python pilot020/test_browser_continuity.py --browser chrome-headed
          else
            python pilot020/test_browser_continuity.py --browser chrome
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot020-${{ matrix.browser }}-evidence
          path: pilot020-results/
          if-no-files-found: ignore
          retention-days: 7
