name: SefaXTV 0.17 External VOD trace
on:
  push:
    branches: ['lab/sefaxtv-pilot-v017']
    paths: ['pilot017/**', '.github/workflows/pilot-017.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pilot017/test-progress.mjs
      - run: node --check pilot017/diagnostic.mjs
      - run: |
          npm install --no-save --ignore-scripts --package-lock=false @peertube/embed-api@0.2.0
          mkdir -p pilot017/vendor
          cp node_modules/@peertube/embed-api/build/player.min.js pilot017/vendor/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile pilot017/test_external.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: python pilot017/test_external.py
