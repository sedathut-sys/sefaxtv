name: SefaXTV 0.19 Sustained VOD proof
on:
  push:
    branches: ['lab/sefaxtv-pilot-v019']
    paths: ['pilot019/**', '.github/workflows/pilot-019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, chrome-headed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node pilot017/test-progress.mjs
      - run: |
          npm install --no-save --ignore-scripts --package-lock=false @peertube/embed-api@0.2.0
          mkdir -p pilot017/vendor
          cp node_modules/@peertube/embed-api/build/player.min.js pilot017/vendor/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pilot019/test_continuity.py
      - run: python -m py_compile pilot019/test_browser_continuity.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chrome; fi
          google-chrome --version
      - run: |
          if [ "${{ matrix.browser }}" = chrome-headed ]; then
            xvfb-run -a python pilot019/test_browser_continuity.py --browser chrome-headed
          else
            python pilot019/test_browser_continuity.py --browser chrome
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot019-${{ matrix.browser }}-evidence
          path: pilot019-results/
          if-no-files-found: ignore
          retention-days: 7
