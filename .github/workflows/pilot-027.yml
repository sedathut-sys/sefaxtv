name: SefaXTV 0.27 smart HLS and local dubbing prototype
on:
  push:
    branches: ['lab/sefaxtv-pilot-v027']
    paths: ['pilot027/**', '.github/workflows/pilot-027.yml']
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    concurrency:
      group: sefaxtv-external-single-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false hls.js@1.6.13 esbuild@0.25.5
      - run: ./node_modules/.bin/esbuild pilot027/vendor-entry.mjs --bundle --platform=browser --format=esm --outfile=pilot027/vendor/hls.mjs
      - run: node pilot027/test-controller.mjs && node pilot026/test-frame-gate.mjs && node --check pilot027/hls-driver.mjs && node --check pilot027/viewer.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile pilot027/test_viewer.py
      - run: python -m pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          if ! command -v google-chrome >/dev/null; then python -m playwright install chrome; fi
      - run: python pilot027/test_viewer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot027-viewer-evidence
          path: pilot027-results/
          if-no-files-found: ignore
          retention-days: 7
  dub:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install -r pilot027/dub/requirements.txt
      - run: python -m py_compile pilot027/dub/engine.py pilot027/dub/test_dub.py
      - run: python pilot027/dub/test_dub.py
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot027-dub-evidence
          path: pilot027-dub-results/
          if-no-files-found: ignore
          retention-days: 7
